<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔋 电池维修 AI 助手</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }
    header { background: rgba(30,41,59,0.95); backdrop-filter: blur(10px); padding: 12px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    header h1 { font-size: 18px; font-weight: 600; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; flex-shrink: 0; }
    .status-dot.connected { background: #22c55e; box-shadow: 0 0 8px #22c55e; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    #main { display: flex; flex: 1; overflow: hidden; }
    #sidebar { width: 280px; background: rgba(30,41,59,0.5); border-right: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; overflow-y: auto; }
    .sidebar-section { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .sidebar-section h3 { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    .upload-zone { border: 2px dashed rgba(255,255,255,0.2); border-radius: 12px; padding: 16px; text-align: center; cursor: pointer; transition: all 0.3s; background: rgba(255,255,255,0.05); }
    .upload-zone:hover { border-color: #3b82f6; background: rgba(59,130,246,0.1); }
    .upload-zone.dragover { border-color: #22c55e; }
    .upload-zone input { display: none; }
    #image-preview { width: 100%; max-height: 160px; object-fit: contain; border-radius: 8px; margin-top: 8px; display: none; }
    .comp-card { background: rgba(255,255,255,0.05); border-radius: 8px; padding: 8px 12px; margin-bottom: 6px; border-left: 3px solid #3b82f6; }
    .comp-card .name { font-weight: 600; font-size: 13px; }
    .comp-card .type { font-size: 11px; color: #94a3b8; }
    #history-list { display: flex; flex-direction: column; gap: 6px; }
    .hist-item { background: rgba(255,255,255,0.05); border-radius: 8px; padding: 8px 12px; cursor: pointer; transition: background 0.2s; }
    .hist-item:hover { background: rgba(255,255,255,0.1); }
    .hist-item .symptom { font-size: 13px; font-weight: 500; }
    .hist-item .date { font-size: 11px; color: #64748b; margin-top: 4px; }
    #content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.6; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } }
    .msg.ai { background: rgba(51,65,85,0.8); align-self: flex-start; border-bottom-left-radius: 4px; }
    .msg.user { background: linear-gradient(135deg, #3b82f6, #2563eb); align-self: flex-end; color: white; border-bottom-right-radius: 4px; }
    .msg.system { background: transparent; color: #64748b; font-size: 13px; text-align: center; align-self: center; }
    .msg.error { background: rgba(239,68,68,0.2); border: 1px solid rgba(239,68,68,0.5); color: #f87171; }
    .typing { display: flex; gap: 4px; padding: 8px; }
    .typing span { width: 6px; height: 6px; background: #64748b; border-radius: 50%; animation: bounce 1.4s infinite; }
    .typing span:nth-child(1){animation-delay:0s} .typing span:nth-child(2){animation-delay:0.2s} .typing span:nth-child(3){animation-delay:0.4s}
    @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }
    .cause-item { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .cause-item:last-child { border-bottom: none; }
    .prob-badge { background: #3b82f6; color: white; padding: 2px 8px; border-radius: 10px; font-size: 11px; flex-shrink: 0; }
    .report-box { background: rgba(15,23,42,0.9); border: 1px solid rgba(34,197,94,0.4); border-radius: 12px; padding: 16px; margin: 8px 0; }
    .report-box h4 { color: #22c55e; margin-bottom: 12px; font-size: 14px; }
    .report-box pre { white-space: pre-wrap; font-size: 13px; line-height: 1.8; }
    #input-area { padding: 12px 16px; background: rgba(30,41,59,0.8); display: flex; gap: 8px; border-top: 1px solid rgba(255,255,255,0.1); }
    #msgInput { flex: 1; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 12px 20px; color: white; font-size: 14px; outline: none; }
    #msgInput:focus { border-color: #3b82f6; }
    #msgInput::placeholder { color: #64748b; }
    #sendBtn { background: #3b82f6; border: none; border-radius: 24px; padding: 12px 20px; color: white; font-size: 14px; cursor: pointer; }
    #sendBtn:hover { background: #2563eb; }
    #reportBtn { background: #22c55e; border: none; border-radius: 24px; padding: 12px 16px; color: white; font-size: 14px; cursor: pointer; }
    #reportBtn:hover { background: #16a34a; }
    #clearBtn { background: transparent; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 6px 12px; color: #94a3b8; font-size: 12px; cursor: pointer; margin-top: 8px; }
    #clearBtn:hover { background: rgba(255,255,255,0.1); }
  </style>
</head>
<body>
  <header>
    <div class="status-dot" id="statusDot"></div>
    <h1>🔋 电池维修 AI 助手</h1>
    <span id="sessionId" style="margin-left:auto;font-size:12px;color:#64748b;"></span>
  </header>
  <div id="main">
    <div id="sidebar">
      <div class="sidebar-section">
        <h3>📷 上传 PCB 照片</h3>
        <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
          <input type="file" id="fileInput" accept="image/*" onchange="handleFile(this.files[0])">
          <div style="font-size:28px;">📁</div>
          <p style="font-size:12px;">点击或拖拽上传</p>
          <img id="image-preview" alt="预览">
        </div>
      </div>
      <div class="sidebar-section">
        <h3>🔧 已识别元件</h3>
        <div id="components-list"><p style="font-size:12px;color:#64748b;">暂无</p></div>
      </div>
      <div class="sidebar-section" style="flex:1;overflow-y:auto;">
        <h3>📋 历史记录</h3>
        <div id="history-list"></div>
        <button id="clearBtn" onclick="clearHistory()">清除历史</button>
      </div>
    </div>
    <div id="content">
      <div id="messages">
        <div class="msg system">👋 欢迎使用电池维修 AI 助手！<br>1. 上传 PCB 照片<br>2. 描述故障现象<br>3. 获取维修建议</div>
      </div>
      <div id="input-area">
        <input type="text" id="msgInput" placeholder="描述故障，例如：充电时发热严重" onkeypress="if(event.key==='Enter')sendText()">
        <button id="sendBtn" onclick="sendText()">发送</button>
        <button id="reportBtn" onclick="requestReport()">📋 报告</button>
      </div>
    </div>
  </div>
<script>
let ws = null;
let currentSymptom = '';
let history = [];

function connect() {
  const sid = 'repair_' + Math.random().toString(36).substr(2, 8);
  ws = new WebSocket(`${location.protocol==='https:'?'wss:':'ws:'}//${location.host}/ws/${sid}`);
  ws.onopen = () => { document.getElementById('statusDot').classList.add('connected'); document.getElementById('sessionId').textContent = sid; loadHistory(); };
  ws.onclose = () => { document.getElementById('statusDot').classList.remove('connected'); setTimeout(connect, 3000); };
  ws.onmessage = e => { const d = JSON.parse(e.data); removeTyping(); handleMsg(d); };
  ws.onerror = () => addMsg('ai', '连接错误', 'error');
}

function handleMsg(d) {
  if (d.type === 'connected') { document.getElementById('sessionId').textContent = d.session_id; }
  else if (d.type === 'status') addMsg('ai', d.message, 'system');
  else if (d.type === 'error') addMsg('ai', d.message, 'error');
  else if (d.type === 'analysis') { showComps(d.components); saveToHistory(); }
  else if (d.type === 'reasoning') showReasoning(d.causes);
  else if (d.type === 'report') showReport(d.content);
}

function addMsg(role, content, extra='') {
  const div = document.createElement('div');
  div.className = 'msg ' + role + ' ' + extra;
  div.innerHTML = content;
  document.getElementById('messages').appendChild(div);
  div.scrollIntoView({behavior:'smooth'});
}

function addTyping() {
  const div = document.createElement('div');
  div.id = 'typing';
  div.className = 'msg ai typing';
  div.innerHTML = '<span></span><span></span><span></span>';
  document.getElementById('messages').appendChild(div);
}

function removeTyping() { const t = document.getElementById('typing'); if (t) t.remove(); }

function handleFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('image-preview').src = e.target.result;
    document.getElementById('image-preview').style.display = 'block';
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({type:'image', image_id:'img_'+Date.now(), data:e.target.result.split(',')[1], filename:file.name}));
      addTyping();
    }
  };
  reader.readAsDataURL(file);
}

function sendText() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  currentSymptom = text;
  addMsg('user', text);
  input.value = '';
  if (ws && ws.readyState === WebSocket.OPEN) { addTyping(); ws.send(JSON.stringify({type:'symptom', symptom:text})); }
}

function requestReport() {
  if (!ws || ws.readyState !== WebSocket.OPEN) { addMsg('ai','请先连接服务器','error'); return; }
  addTyping();
  ws.send(JSON.stringify({type:'text', content:'生成维修报告'}));
}

function showComps(comps) {
  const el = document.getElementById('components-list');
  if (!comps || !comps.length) { el.innerHTML = '<p style="font-size:12px;color:#64748b;">未识别到元件</p>'; return; }
  el.innerHTML = comps.map(c => `<div class="comp-card"><div class="name">${c.name||c.type||'未知'}</div><div class="type">${c.type||''} ${c.value?'· '+c.value:''}</div></div>`).join('');
}

function showReasoning(causes) {
  if (!causes || !causes.length) return;
  const html = causes.map(c => `<div class="cause-item"><span class="prob-badge">${Math.round((c.probability||0.5)*100)}%</span><div><div>${c.cause||c.description||''}</div>${c.fix?'<div style="font-size:12px;color:#94a3b8;margin-top:4px;">修复：'+c.fix+'</div>':''}</div></div>`).join('');
  addMsg('ai', '<h4 style="color:#3b82f6;margin-bottom:8px;">🔍 可能原因</h4>' + html);
  saveToHistory();
}

function showReport(content) {
  const html = '<div class="report-box"><h4>📋 维修报告</h4><pre>'+(typeof content==='string'?content:JSON.stringify(content,null,2))+'</pre></div>';
  addMsg('ai', html);
  saveToHistory();
}

async function loadHistory() {
  try {
    const r = await fetch('/api/history');
    const d = await r.json();
    history = d.history || [];
    renderHistory();
  } catch(e) {}
}

function saveToHistory() {
  if (!currentSymptom) return;
  const item = {symptom: currentSymptom, date: new Date().toLocaleString()};
  history.unshift(item);
  if (history.length > 50) history.pop();
  renderHistory();
  fetch('/api/history', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(item)}).catch(()=>{});
}

function renderHistory() {
  const el = document.getElementById('history-list');
  if (!history.length) { el.innerHTML = '<p style="font-size:12px;color:#64748b;">暂无历史</p>'; return; }
  el.innerHTML = history.map(h => `<div class="hist-item" onclick="loadFromHistory('${h.symptom.replace(/'/g,"\\'")}')"><div class="symptom">${h.symptom}</div><div class="date">${h.date}</div></div>`).join('');
}

function loadFromHistory(symptom) {
  document.getElementById('msgInput').value = symptom;
  sendText();
}

function clearHistory() {
  if (!confirm('确定清除所有历史记录？')) return;
  history = [];
  renderHistory();
  fetch('/api/history', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({clear:true})}).catch(()=>{});
}

connect();
const uz = document.getElementById('uploadZone');
uz.addEventListener('dragover', e => { e.preventDefault(); uz.classList.add('dragover'); });
uz.addEventListener('dragleave', e => { uz.classList.remove('dragover'); });
uz.addEventListener('drop', e => { e.preventDefault(); uz.classList.remove('dragover'); const file = e.dataTransfer.files[0]; if (file) handleFile(file); });
</script>
</body>
</html>
